services:
  # Backend API - Node.js/Express
  - type: web
    name: portfolio-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      # Where contact-form notifications are delivered (your inbox).
      - key: ADMIN_EMAIL
        sync: false
      # ── Brevo (primary email provider — free, no domain needed) ──
      - key: BREVO_API_KEY
        sync: false
      # Must be an email address verified in your Brevo account (Senders).
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      # ── Resend (fallback, only used if BREVO_API_KEY is not set) ──
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PORTFOLIO_OWNER_NAME
        sync: false
      - key: FRONTEND_URL
        value: https://portfolio-frontend-osom.onrender.com
      - key: ADMIN_URL
        value: https://portfolio-frontend-osom.onrender.com

  # Frontend - React/Vite Static Site
  - type: web
    name: portfolio-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Cache-Control rules must not overlap: Render doesn't document precedence,
    # and a broad /* rule has been observed overriding more specific paths.
    headers:
      # Hashed build assets never change — cache them for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # HTML entry points and SPA routes always revalidate so deploys show up immediately.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /blogs
        name: Cache-Control
        value: no-cache
      - path: /blog/*
        name: Cache-Control
        value: no-cache
      - path: /admin/*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://portfolio-backend-osom.onrender.com/api
